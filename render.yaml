services:
  - type: web
    name: library-management-api
    runtime: docker
    plan: free
    dockerfilePath: ./Library-Management-System-backend/Dockerfile
    dockerContext: ./Library-Management-System-backend
    healthCheckPath: /health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://library-management-frontend.onrender.com
      - key: SPRING_JPA_SHOW_SQL
        value: "false"

  - type: web
    name: library-management-frontend
    runtime: static
    rootDir: library-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://library-management-api.onrender.com
