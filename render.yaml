databases:
  - name: library-management-db
    databaseName: library_management
    user: library_management
    plan: free

services:
  - type: web
    name: library-management-api
    runtime: docker
    plan: free
    dockerfilePath: ./Library-Management-System-backend/Dockerfile
    dockerContext: ./Library-Management-System-backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: library-management-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: static
          name: library-management-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: SPRING_JPA_SHOW_SQL
        value: "false"

  - type: web
    name: library-management-frontend
    runtime: static
    rootDir: library-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: library-management-api
          envVarKey: RENDER_EXTERNAL_URL
